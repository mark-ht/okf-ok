<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OKF relationship viewer</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#10151d;color:#e5edf7}body{margin:0;display:grid;grid-template-columns:minmax(460px,2fr) minmax(320px,1fr);height:100vh}main{min-width:0;padding:16px}aside{overflow:auto;background:#18212d;border-left:1px solid #334155;padding:18px}h1{font-size:18px;margin:0 0 8px}h2{font-size:16px;margin:18px 0 8px}#legend{color:#aab8c8;margin-bottom:10px}.graph{width:100%;height:calc(100vh - 95px);border:1px solid #334155;border-radius:8px;background:#0b1017}.edge{stroke:#607087;stroke-width:1.4;opacity:.75}.edge.missing,.edge.unsafe{stroke:#f87171;stroke-dasharray:5 4}.edge.external,.edge.descriptor{stroke:#fbbf24;stroke-dasharray:3 4}.edge.fragment{stroke:#34d399}.node{cursor:pointer;stroke:#dbeafe;stroke-width:1.5;fill:#3b82f6}.node.reserved{fill:#64748b}.node.selected{stroke:#fbbf24;stroke-width:3}.label{font-size:11px;fill:#dbeafe;pointer-events:none}.muted{color:#aab8c8}.tag{display:inline-block;background:#243449;padding:2px 6px;border-radius:4px;margin:2px 3px 2px 0}.heading{margin-left:calc((var(--level) - 1) * 12px)}a{color:#7dd3fc}button{background:none;border:0;color:#7dd3fc;padding:2px;cursor:pointer;text-align:left;font:inherit}pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:#0b1017;padding:10px;border-radius:6px}.edge-list{padding-left:0;list-style:none}.edge-list li{margin:5px 0}.status{font-size:11px;border-radius:3px;padding:1px 4px;background:#334155}.empty{padding:24px;color:#aab8c8}@media(max-width:800px){body{display:block;height:auto}main{height:65vh}aside{border-left:0;border-top:1px solid #334155}.graph{height:calc(65vh - 95px)}}
</style></head><body><main><h1>OKF relationship viewer</h1><div id="legend">Blue: concept · gray: reserved · red dashed: missing/unsafe · amber dashed: external/descriptor · green: fragment</div><svg class="graph" id="graph" role="img" aria-label="OKF document relationship graph"></svg></main><aside id="detail"><h1>Select a document</h1><p class="muted">Click a graph node to inspect its OKF type, headings, links, and source preview.</p></aside><script>
const esc=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const detail=document.getElementById('detail');
const q=new URLSearchParams(location.search);let selected=q.get('doc');let selectedHeading=q.get('heading');
fetch('/api/graph').then(r=>r.json()).then(data=>{const nodes=new Map(data.nodes.map(n=>[n.path,n]));if(!nodes.has(selected))selected=data.nodes[0]?.path;render(data,nodes);show(selected,data,nodes)}).catch(e=>{detail.innerHTML='<h1>Viewer failed to load</h1><pre>'+esc(e)+'</pre>'});
function render(data,nodes){const svg=document.getElementById('graph'),w=svg.clientWidth||700,h=svg.clientHeight||600,cx=w/2,cy=h/2,r=Math.max(100,Math.min(w,h)/2-70),pos=new Map();svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} ${h}`);data.nodes.forEach((n,i)=>{const a=(Math.PI*2*i/data.nodes.length)-Math.PI/2;pos.set(n.path,{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)})});const ns='http://www.w3.org/2000/svg';for(const e of data.edges){const a=pos.get(e.source),b=pos.get(e.target);if(!a||!b)continue;const line=document.createElementNS(ns,'line'),title=document.createElementNS(ns,'title');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','edge '+e.status);title.textContent=`${e.kind}: ${e.raw_target} (${e.status})`;line.append(title);svg.append(line)}for(const n of data.nodes){const p=pos.get(n.path),g=document.createElementNS(ns,'g'),circle=document.createElementNS(ns,'circle'),label=document.createElementNS(ns,'text');circle.setAttribute('cx',p.x);circle.setAttribute('cy',p.y);circle.setAttribute('r',n.path===selected?'11':'8');circle.setAttribute('class','node '+n.kind+(n.path===selected?' selected':''));label.setAttribute('x',p.x+11);label.setAttribute('y',p.y+4);label.setAttribute('class','label');label.textContent=n.path;g.append(circle,label);g.onclick=()=>{selected=n.path;selectedHeading='';history.replaceState(null,'','/?doc='+encodeURIComponent(selected));render(data,nodes);show(selected,data,nodes)};svg.append(g)}}
function show(path,data,nodes){const n=nodes.get(path);if(!n)return;const outgoing=data.edges.filter(e=>e.source===path),incoming=data.edges.filter(e=>e.target===path);const headings=n.headings.length?n.headings.map(h=>`<div class="heading" style="--level:${h.level}"><a data-heading="${esc(h.id)}" href="/section?path=${encodeURIComponent(path)}&heading=${encodeURIComponent(h.id)}">${esc(h.text)}</a></div>`).join(''):'<span class="muted">No Markdown headings</span>';const links=(es,title)=>`<h2>${title}</h2><ul class="edge-list">${es.length?es.map(e=>`<li><span class="status">${esc(e.status)}</span> ${e.target&&nodes.has(e.target)?`<button data-doc="${esc(e.target)}">${esc(e.target)}</button>`:esc(e.raw_target)} <span class="muted">${esc(e.kind)}</span></li>`).join(''):'<li class="muted">None</li>'}</ul>`;detail.innerHTML=`<h1>${esc(n.path)}</h1><p><span class="tag">${esc(n.kind)}</span>${n.type?`<span class="tag">${esc(n.type)}</span>`:''}</p><p><a href="/document?path=${encodeURIComponent(n.path)}" target="_blank" rel="noopener">Open document source</a></p><h2>Headings</h2>${headings}<h2 id="section-title">Selected section</h2><pre id="section">Select a heading to load its Markdown section.</pre>${links(outgoing,'Outgoing references')}${links(incoming,'Incoming references')}<h2>Preview${n.truncated?' (truncated)':''}</h2><pre id="preview"></pre>`;detail.querySelector('#preview').textContent=n.preview;detail.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{selected=b.dataset.doc;selectedHeading='';history.replaceState(null,'','/?doc='+encodeURIComponent(selected));render(data,nodes);show(selected,data,nodes)});detail.querySelectorAll('[data-heading]').forEach(a=>a.onclick=event=>{event.preventDefault();selectedHeading=a.dataset.heading;history.replaceState(null,'','/?doc='+encodeURIComponent(path)+'&heading='+encodeURIComponent(selectedHeading));showSection(path,selectedHeading)});if(selectedHeading&&n.headings.some(h=>h.id===selectedHeading))showSection(path,selectedHeading)}
async function showSection(path,heading){const section=detail.querySelector('#section'),title=detail.querySelector('#section-title');if(!section||!title)return;title.textContent='Selected section: '+heading;section.textContent='Loading…';try{const response=await fetch('/section?path='+encodeURIComponent(path)+'&heading='+encodeURIComponent(heading));if(!response.ok)throw new Error('section request failed: '+response.status);section.textContent=await response.text();if(response.headers.get('X-OKF-Truncated')==='true')section.textContent+='\n\n[Section preview truncated]'}catch(error){section.textContent='Could not load section: '+error}}
</script></body></html>
