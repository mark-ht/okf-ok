<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OKF viewer</title><style>:root{color-scheme:dark;font:14px system-ui;background:#10151d;color:#e5edf7}body{margin:0;display:grid;grid-template-columns:280px minmax(400px,1fr) 360px;height:100vh}aside,main{padding:14px;overflow:auto;border-right:1px solid #334155}#detail{border:0}h1{font-size:17px;margin:0 0 12px}h2{font-size:15px;margin:15px 0 7px}input{box-sizing:border-box;width:100%;padding:8px;background:#0b1017;color:#e5edf7;border:1px solid #475569;border-radius:5px}button,a{color:#7dd3fc;background:none;border:0;padding:3px;cursor:pointer;text-align:left;font:inherit}.item{display:block;width:100%}.muted{color:#aab8c8}.tag,.count{background:#26364b;border-radius:4px;padding:2px 5px;font-size:12px}.tree{list-style:none;padding:0}.tree li{margin:4px 0}svg{width:100%;height:calc(100vh - 85px);border:1px solid #334155;border-radius:7px;background:#0b1017}.edge{stroke:#607087}.node{fill:#3b82f6;stroke:#dbeafe;cursor:pointer}.label{fill:#dbeafe;font-size:12px}.edge-list{padding-left:0;list-style:none}.edge-list li{margin:5px 0}pre{white-space:pre-wrap;background:#0b1017;padding:9px;border-radius:5px} @media(max-width:900px){body{grid-template-columns:250px 1fr;height:auto}#detail{grid-column:1/-1;border-top:1px solid #334155}svg{height:480px}}</style><body><aside><h1>Explore knowledge</h1><input id="search" placeholder="Search path or type"><h2>Directories</h2><div id="tree"></div></aside><main><h1 id="title">Package overview</h1><p class="muted" id="subtitle">Aggregate relationships only. Select a directory or document to narrow the view.</p><svg id="graph" aria-label="Focused relationship graph"></svg></main><aside id="detail"><h1>Select a document</h1><p class="muted">Search or browse the tree. The viewer never draws the full corpus graph.</p></aside><script>const $=id=>document.getElementById(id),detail=document.getElementById('detail'),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current='';const api=p=>fetch(p).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});function loadTree(path=''){api('/api/tree?path='+encodeURIComponent(path)).then(data=>{tree.innerHTML=(path?`<button class="item" data-path="${esc(path.split('/').slice(0,-1).join('/'))}">← up</button>`:'')+`<ul class="tree">`+data.children.map(c=>`<li>${c.kind==='directory'?`<button class="item" data-path="${esc(c.path)}">📁 ${esc(c.path)} <span class="count">${c.documents}</span></button>`:`<button class="item" data-doc="${esc(c.path)}">${esc(c.path)} ${c.type?`<span class="tag">${esc(c.type)}</span>`:''}</button>`}</li>`).join('')+'</ul>';tree.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>loadTree(b.dataset.path));tree.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>select(b.dataset.doc))})}function overview(){api('/api/overview').then(data=>{title.textContent='Package overview';draw(data.nodes.map(n=>({path:n.path})),data.edges);subtitle.textContent='Aggregate package/directory relationships. Select a document for a bounded neighborhood.'})}function draw(nodes,edges){const svg=$('graph'),w=svg.clientWidth||600,h=svg.clientHeight||500,cx=w/2,cy=h/2,r=Math.max(80,Math.min(w,h)/2-55),pos=new Map(),ns='http://www.w3.org/2000/svg';svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} ${h}`);nodes.forEach((n,i)=>{let a=2*Math.PI*i/Math.max(nodes.length,1)-Math.PI/2;pos.set(n.path,{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)})});edges.forEach(e=>{let a=pos.get(e.source),b=pos.get(e.target);if(!a||!b)return;let l=document.createElementNS(ns,'line');l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);l.setAttribute('class','edge');svg.append(l)});nodes.forEach(n=>{let p=pos.get(n.path),g=document.createElementNS(ns,'g'),c=document.createElementNS(ns,'circle'),t=document.createElementNS(ns,'text');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r','9');c.setAttribute('class','node');t.setAttribute('x',p.x+12);t.setAttribute('y',p.y+4);t.setAttribute('class','label');t.textContent=n.path;g.append(c,t);g.onclick=()=>select(n.path);svg.append(g)})}function select(doc){current=doc;api('/api/neighborhood?path='+encodeURIComponent(doc)+'&depth=1&limit=150').then(data=>{title.textContent=doc;subtitle.textContent=data.truncated?'Neighborhood truncated at 150 documents.':'Direct relationship neighborhood.';draw(data.nodes,data.edges);show(data,doc)})}function show(data,doc){let n=data.nodes.find(n=>n.path===doc);if(!n)return;let out=data.edges.filter(e=>e.source===doc),inc=data.edges.filter(e=>e.target===doc),rows=(es,label)=>`<h2>${label}</h2><ul class="edge-list">${es.map(e=>`<li><span class="count">${e.count||1}</span> <button data-doc="${esc(e.source===doc?e.target:e.source)}">${esc(e.source===doc?e.target:e.source)}</button> <span class="muted">${esc(e.kind)}</span></li>`).join('')||'<li class="muted">None</li>'}</ul>`;detail.innerHTML=`<h1>${esc(n.path)}</h1><p>${n.type?`<span class="tag">${esc(n.type)}</span>`:''}</p><p><a target="_blank" href="/document?path=${encodeURIComponent(n.path)}">Open document</a>${n.source_available?` · <a target="_blank" href="/source?path=${encodeURIComponent(n.path)}">Open source</a>`:''}</p>${rows(out,'Outgoing')}${rows(inc,'Incoming')}<h2>Preview</h2><pre>${esc(n.preview)}</pre>`;detail.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>select(b.dataset.doc))}$('search').oninput=e=>{let q=e.target.value.trim();if(!q){loadTree('');return}api('/api/search?q='+encodeURIComponent(q)).then(nodes=>{tree.innerHTML='<ul class="tree">'+nodes.map(n=>`<li><button class="item" data-doc="${esc(n.path)}">${esc(n.path)} <span class="tag">${esc(n.type||n.kind)}</span></button></li>`).join('')+'</ul>';tree.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>select(b.dataset.doc))})};loadTree();overview();</script></body></html>
